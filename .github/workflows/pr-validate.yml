name: PR Validate

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate templates
        run: bash validate.sh
